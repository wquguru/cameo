<!doctype html>
<!-- The gallery's social card (Open Graph / X), variant B "stage" from the OG design canvas.
     Rendered to gallery/og.png by scripts/og-image.sh; edit here, then rerun it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cameo social card</title>
<style>
  html, body { margin: 0; }
  body {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #161618; color: #F5F1EA;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .beam {
    position: absolute; left: 640px; top: 0; width: 520px; height: 630px;
    background: linear-gradient(180deg, rgba(255, 210, 122, .36), rgba(255, 179, 64, 0) 92%);
    clip-path: polygon(40% 0, 60% 0, 96% 100%, 4% 100%);
  }
  .floor {
    position: absolute; left: 650px; top: 500px; width: 500px; height: 90px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 200, 100, .55), rgba(255, 200, 100, 0));
  }
  .cat { position: absolute; left: 700px; top: 224px; width: 400px; height: 345px; object-fit: contain; }
  .copy { position: absolute; left: 72px; top: 64px; width: 540px; display: flex; flex-direction: column; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; }
  .brand img { width: 56px; height: 56px; }
  h1 { margin: 0; font-size: 68px; line-height: 1.04; font-weight: 800; letter-spacing: -.03em; }
  h1 span { color: #FFB340; }
  p { margin: 0; font-size: 26px; line-height: 1.35; color: #C7C2BA; }
  .foot { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; color: #C7C2BA; }
  .url { height: 44px; padding: 0 20px; border-radius: 22px; background: #FFB340; color: #161618; display: flex; align-items: center; }
</style>
</head>
<body>
  <div class="beam"></div>
  <div class="floor"></div>
  <img class="cat" src="../gallery/posters/chaofei.png" alt="">
  <div class="copy">
    <div class="brand"><img src="../gallery/icon.png" alt="">Cameo</div>
    <h1>Put a character <span>on your Mac</span></h1>
    <p>Free characters that live on top of your windows. Transparent, click-through, open source.</p>
  </div>
  <div class="foot"><span class="url">wquguru.github.io/cameo</span><span>macOS 14+</span></div>
</body>
</html>
