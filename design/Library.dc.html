<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Cameo 角色库</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 960px; height: 680px; display: flex; flex-direction: column; overflow: hidden; border-radius: 26px; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; color: #1D1D1F; -webkit-font-smoothing: antialiased">

<dc-import name="LibraryToolbar" count="24" hint-size="960px,64px"></dc-import>

<main aria-label="角色" style="flex: 1; box-sizing: border-box; padding: 8px 28px 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 17px; row-gap: 18px; align-content: start; justify-items: center; overflow: hidden">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="24">
<dc-import name="LibraryCard" label="{{c.name}}" figure="{{c.figure}}" state="{{c.state}}" hint-size="136px,136px"></dc-import>
</sc-for>
</main>

<div role="menu" aria-label="“鞠躬”的操作" style="position: absolute; left: 262px; top: 292px; width: 196px; box-sizing: border-box; padding: 5px; border-radius: 14px; background: rgba(246,246,248,0.94); border: 0.5px solid rgba(0,0,0,0.12); box-shadow: 0 14px 36px rgba(0,0,0,0.2); display: flex; flex-direction: column; font-size: 13px">
<button role="menuitem" style="height: 26px; padding: 0 10px; border: 0; border-radius: 8px; background: #0A6CE0; color: #FFFFFF; font: inherit; text-align: left; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.5l.6-2.6 7-7 2 2-7 7z"></path></svg>重命名</button>
<button role="menuitem" style="height: 26px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #1D1D1F; font: inherit; text-align: left; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5a1.5 1.5 0 0 1 1.5-1.5h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"></path></svg>在访达中显示</button>
<div role="separator" style="height: 1px; margin: 4px 10px; background: rgba(0,0,0,0.1)"></div>
<button role="menuitem" style="height: 26px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #1D1D1F; font: inherit; text-align: left; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5"></path></svg><span style="flex: 1">移到废纸篓</span><span style="color: #8A8A8E">⌘⌫</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":680}}'>
class Component extends DCLogic {
renderVals() {
const names = ['Chaofei', 'Wave', '待机', 'Hip-hop 跳舞', '打招呼', '伸懒腰', 'Office Coffee Break Loop v2', '鞠躬', '点头', '跑步', 'Thinking', '坐姿看书', '转身挥手', '跳绳', '弹吉他', 'Robot', '拍手', '喝咖啡', 'Yoga 拉伸', '敲键盘', '比心', '思考 2', 'Jump', '再见'];
return {
  cards: names.map((name, i) => ({
    name,
    figure: i === 0 ? 'cat' : 'person',
    state: i === 0 ? 'lit' : i === 3 ? 'hover' : 'normal'
  }))
};
}
}
</script>
</body>
</html>
