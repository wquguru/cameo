<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>角色库工具栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="toolbar" aria-label="角色库工具栏" style="width: 960px; height: 64px; box-sizing: border-box; padding: 0 14px 0 20px; display: flex; align-items: center; gap: 10px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; color: #1D1D1F; -webkit-font-smoothing: antialiased">

<div style="display: flex; gap: 9px; padding-right: 14px" aria-hidden="true">
<span style="width: 13px; height: 13px; border-radius: 7px; background: #FF5F57; display: block"></span>
<span style="width: 13px; height: 13px; border-radius: 7px; background: #FEBC2E; display: block"></span>
<span style="width: 13px; height: 13px; border-radius: 7px; background: #28C840; display: block"></span>
</div>

<div style="display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0">
<div style="font-size: 20px; font-weight: 700">角色</div>
<div style="font-size: 13px; color: #6E6E73">{{count}}</div>
</div>

<label style="width: 220px; height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 19px; background: rgba(255,255,255,0.92); border: 0.5px solid rgba(0,0,0,0.06); box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 7px">
<svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#3A3A3C" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.6"></circle><path d="M10 10l3.5 3.5"></path></svg>
<input type="search" aria-label="搜索角色" placeholder="搜索" value="{{query}}" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13px; color: #1D1D1F; outline: none">
</label>

<button aria-label="添加角色视频" style="width: 38px; height: 38px; box-sizing: border-box; border-radius: 19px; background: rgba(255,255,255,0.92); border: 0.5px solid rgba(0,0,0,0.06); box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="#3A3A3C" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11"></path></svg>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"count":{"editor":"text","default":"24"},"query":{"editor":"text","default":""},"$preview":{"width":960,"height":64}}'>
class Component extends DCLogic {
renderVals() {
return { count: this.props.count ?? '24', query: this.props.query ?? '' };
}
}
</script>
</body>
</html>
