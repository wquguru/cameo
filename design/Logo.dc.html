<!doctype html>
<html lang="zh-CN">
<head>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#ffb340}a:hover{color:#ffd27a}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 72px 88px; display: grid; grid-template-columns: 420px minmax(0, 1fr); column-gap: 80px; background: #0e0e10; color: #f5f1ea; font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif">

  <div style="display: flex; align-items: center; justify-content: center">

  </div>

  <div style="display: flex; flex-direction: column; justify-content: center; gap: 44px">

      <p style="margin: 0; font-size: 22px; color: #a1a1a6">让角色从屏幕里走出来。</p>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 28px">
      <dc-import name="Icon" size="{{ 128 }}" hint-size="128px,128px"></dc-import>
      <dc-import name="Icon" size="{{ 64 }}" hint-size="64px,64px"></dc-import>
      <dc-import name="Icon" size="{{ 32 }}" hint-size="32px,32px"></dc-import>
      <dc-import name="Icon" size="{{ 16 }}" hint-size="16px,16px"></dc-import>
    </div>

    <div style="display: flex; gap: 16px">
      <div style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 12px; border-radius: 8px; background: rgba(246,246,246,0.92); color: #1d1d1f; font-size: 13px">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 4.5H4.5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.3"></path><circle cx="8" cy="3.4" r="1.8" fill="currentColor" stroke="none"></circle><path d="M5.5 14.5v-2.2a2.5 2.5 0 0 1 5 0v2.2"></path></svg>
        <span>菜单栏 · 浅色</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 12px; border-radius: 8px; background: #2c2c2e; color: #f5f5f7; font-size: 13px">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 4.5H4.5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.3"></path><circle cx="8" cy="3.4" r="1.8" fill="currentColor" stroke="none"></circle><path d="M5.5 14.5v-2.2a2.5 2.5 0 0 1 5 0v2.2"></path></svg>
        <span>菜单栏 · 深色</span>
      </div>
    </div>

    <div style="display: flex; gap: 24px">
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 8px; background: #161618; box-shadow: 0 0 0 1px rgba(255,255,255,0.14)"></span><span style="display: flex; flex-direction: column; font-size: 12px"><span>舞台</span><span style="color: #a1a1a6">#161618</span></span></div>
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 8px; background: #ffb340"></span><span style="display: flex; flex-direction: column; font-size: 12px"><span>追光</span><span style="color: #a1a1a6">#FFB340</span></span></div>
      <div style="display: flex; align-items: center; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 8px; background: #f5f1ea"></span><span style="display: flex; flex-direction: column; font-size: 12px"><span>人物</span><span style="color: #a1a1a6">#F5F1EA</span></span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
