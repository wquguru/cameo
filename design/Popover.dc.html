<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>菜单栏弹窗</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#ffb340}a:hover{color:#ffd27a}
</style>
</helmet>
<div style="width: 340px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 14px; border-radius: 16px; background: rgba(22,22,24,0.9); backdrop-filter: blur(30px) saturate(160%); box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 0.5px rgba(255,255,255,0.12); font-family: -apple-system, 'SF Pro Text', 'PingFang SC', sans-serif; color: #f5f5f7; font-size: 13px">

  <div style="display: flex; align-items: center; gap: 8px; padding: 0 2px">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="{{accent}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 4.5H4.5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.3"></path><circle cx="8" cy="3.4" r="1.8" fill="{{accent}}" stroke="none"></circle><path d="M5.5 14.5v-2.2a2.5 2.5 0 0 1 5 0v2.2"></path></svg>
    <span style="flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Cameo</span>
    <button aria-label="显示角色" aria-pressed="{{visible}}" onClick="{{toggleVisible}}" style="width: 38px; height: 22px; border: none; border-radius: 11px; padding: 0; position: relative; cursor: pointer; background: {{visibleBg}}">
      <span style="position: absolute; top: 2px; left: {{visibleKnob}}; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.35)"></span>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{chars}}" as="c" hint-placeholder-count="3">
      <button aria-label="{{c.name}}" aria-pressed="{{c.selected}}" onClick="{{c.pick}}" style="height: 96px; border: none; border-radius: 12px; padding: 0; position: relative; overflow: hidden; cursor: pointer; background: #222225; box-shadow: {{c.ring}}">
        <span style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: {{c.light}}; background: linear-gradient(180deg, rgba(255,210,122,0.38) 0%, rgba(255,179,64,0) 85%); clip-path: polygon(38% 0, 62% 0, 92% 100%, 8% 100%)"></span>
        <span style="position: absolute; left: 14%; bottom: 6px; width: 72%; height: 12px; border-radius: 50%; opacity: {{c.light}}; background: radial-gradient(closest-side, rgba(255,200,100,0.7), rgba(255,200,100,0))"></span>
        <svg style="position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%)" width="36" height="74" viewBox="0 0 100 204" fill="{{c.figure}}"><circle cx="50" cy="22" r="17"></circle><path d="M50 43c-17 0-27 10-29 27l-7 58h13l5 72h12l4-60h4l4 60h12l5-72h13l-7-58c-2-17-12-27-29-27z"></path></svg>
      </button>
    </sc-for>
    <button aria-label="添加角色视频" style="height: 96px; border: 1.5px dashed rgba(255,255,255,0.22); border-radius: 12px; background: transparent; color: #a1a1a6; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg>
    </button>
  </div>

  <label style="display: grid; grid-template-columns: 14px minmax(0, 1fr) 22px; align-items: end; gap: 10px; padding: 0 4px">
    <svg width="10" height="20" viewBox="0 0 100 204" fill="#a1a1a6" aria-hidden="true"><circle cx="50" cy="22" r="17"></circle><path d="M50 43c-17 0-27 10-29 27l-7 58h13l5 72h12l4-60h4l4 60h12l5-72h13l-7-58c-2-17-12-27-29-27z"></path></svg>
    <input type="range" min="20" max="200" value="{{size}}" onChange="{{onSize}}" aria-label="角色大小 {{size}}%" style="width: 100%; margin: 0 0 4px; accent-color: {{accent}}">
    <svg width="16" height="32" viewBox="0 0 100 204" fill="#a1a1a6" aria-hidden="true"><circle cx="50" cy="22" r="17"></circle><path d="M50 43c-17 0-27 10-29 27l-7 58h13l5 72h12l4-60h4l4 60h12l5-72h13l-7-58c-2-17-12-27-29-27z"></path></svg>
  </label>

  <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 6px; border-top: 0.5px solid rgba(255,255,255,0.12)">
    <label style="display: flex; justify-content: space-between; align-items: center; height: 30px; padding: 0 8px; border-radius: 6px; cursor: pointer">
      <span>登录时启动</span>
      <input type="checkbox" checked="{{login}}" onChange="{{toggleLogin}}" style="width: 14px; height: 14px; margin: 0; accent-color: {{accent}}">
    </label>
    <button style="display: flex; justify-content: space-between; align-items: center; height: 30px; padding: 0 8px; border: none; border-radius: 6px; background: transparent; font: inherit; color: #f5f5f7; cursor: pointer"><span>退出</span><span style="color: #a1a1a6">⌘Q</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffb340","options":["#ffb340","#64d2ff","#ff7a9a","#30d158"]},"$preview":{"width":340,"height":290}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { visible: true, picked: 0, size: 80, login: true };
  }
  renderVals() {
    const a = this.props.accent ?? '#ffb340';
    const s = this.state;
    const chars = ['[角色 1]', '[角色 2]', '[角色 3]'].map((name, i) => {
      const on = s.picked === i;
      return {
        name,
        selected: on,
        light: on ? 1 : 0,
        figure: on ? '#f5f1ea' : '#55555a',
        ring: on ? '0 0 0 1.5px ' + a : '0 0 0 0.5px rgba(255,255,255,0.08)',
        pick: () => this.setState({ picked: i })
      };
    });
    return {
      accent: a,
      visible: s.visible,
      visibleBg: s.visible ? a : '#48484a',
      visibleKnob: s.visible ? '18px' : '2px',
      toggleVisible: () => this.setState({ visible: !s.visible }),
      chars,
      size: s.size,
      onSize: (e) => this.setState({ size: Number(e.target.value) }),
      login: s.login,
      toggleLogin: () => this.setState({ login: !s.login })
    };
  }
}
</script>
</body>
</html>
