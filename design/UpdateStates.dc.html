<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>更新行的五种状态</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0066CC}a:hover{color:#004C99}
</style>
</helmet>
<div style="width: 420px; height: 600px; box-sizing: border-box; padding: 28px 50px; background: #D6E0EA; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; color: #1D1D1F; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; font-weight: 600; color: #45474D">1 · 平时</div>
<div style="width: 320px; box-sizing: border-box; padding: 4px 5px; border-radius: 10px; background: rgba(246, 246, 248, 0.92); border: 0.5px solid rgba(0, 0, 0, 0.14)">
<button style="width: 100%; display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 13px; color: #1D1D1F; text-align: left">
<span style="width: 14px"></span><span style="flex: 1">检查更新…</span><span style="font-size: 12px; color: #8A8A8E">0.3.0</span>
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; font-weight: 600; color: #45474D">2 · 检查中（手动点击后）</div>
<div style="width: 320px; box-sizing: border-box; padding: 4px 5px; border-radius: 10px; background: rgba(246, 246, 248, 0.92); border: 0.5px solid rgba(0, 0, 0, 0.14)">
<button disabled style="width: 100%; display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 13px; color: #6E6E73; text-align: left">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.6"></circle><path d="M7 2.4a4.6 4.6 0 0 1 4.6 4.6" fill="none" stroke="#6E6E73" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span style="flex: 1">正在检查更新…</span>
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; font-weight: 600; color: #45474D">3 · 已是最新（停留 3 秒后回到 1）</div>
<div style="width: 320px; box-sizing: border-box; padding: 4px 5px; border-radius: 10px; background: rgba(246, 246, 248, 0.92); border: 0.5px solid rgba(0, 0, 0, 0.14)">
<button style="width: 100%; display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 13px; color: #1D1D1F; text-align: left">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.5l2.6 2.5L11 4.2" fill="none" stroke="#248A3D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="flex: 1">已是最新版本</span><span style="font-size: 12px; color: #8A8A8E">0.3.0</span>
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; font-weight: 600; color: #45474D">4 · 有新版本（悬停态）</div>
<div style="width: 320px; box-sizing: border-box; padding: 4px 5px; border-radius: 10px; background: rgba(246, 246, 248, 0.92); border: 0.5px solid rgba(0, 0, 0, 0.14)">
<button style="width: 100%; display: flex; flex-direction: column; gap: 1px; padding: 4px 9px; border: 0; border-radius: 6px; background: {{accent}}; font: inherit; color: #FFFFFF; text-align: left">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; width: 100%"><span style="width: 6px; height: 6px; border-radius: 3px; background: #FFB340; display: block; margin: 0 4px"></span><span style="flex: 1">更新到 0.3.1</span><span style="font-size: 11px; color: rgba(255,255,255,0.85)">更新说明</span></span>
<span style="font-size: 11px; color: rgba(255,255,255,0.85); padding-left: 18px">0.9 MB · 完成后自动重新打开</span>
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; font-weight: 600; color: #45474D">5 · 下载与安装</div>
<div style="width: 320px; box-sizing: border-box; padding: 4px 5px; border-radius: 10px; background: rgba(246, 246, 248, 0.92); border: 0.5px solid rgba(0, 0, 0, 0.14)">
<div role="status" style="display: flex; flex-direction: column; gap: 5px; padding: 4px 9px 6px 27px">
<span style="display: flex; align-items: center; font-size: 13px"><span style="flex: 1">正在下载 0.3.1…</span><span style="font-size: 12px; color: #6E6E73">62%</span></span>
<span role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" aria-label="下载进度" style="height: 4px; border-radius: 2px; background: rgba(0,0,0,0.1); display: block; overflow: hidden"><span style="width: 62%; height: 4px; border-radius: 2px; background: {{accent}}; display: block"></span></span>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; font-weight: 600; color: #45474D">6 · 失败（已打开下载页）</div>
<div style="width: 320px; box-sizing: border-box; padding: 4px 5px; border-radius: 10px; background: rgba(246, 246, 248, 0.92); border: 0.5px solid rgba(0, 0, 0, 0.14)">
<button style="width: 100%; display: flex; flex-direction: column; gap: 1px; padding: 4px 9px; border: 0; border-radius: 6px; background: transparent; font: inherit; color: #1D1D1F; text-align: left">
<span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #C4271B"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.8L12.6 11.6H1.4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path><path d="M7 5.6v2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path><circle cx="7" cy="10" r="0.8" fill="currentColor"></circle></svg>无法自动更新</span>
<span style="font-size: 11px; color: #6E6E73; padding-left: 18px">请先把 Cameo 移到“应用程序”。已打开下载页</span>
</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0A7AFF","options":["#0A7AFF","#FFB340","#8E8E93"]},"$preview":{"width":420,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0A7AFF' };
}
}
</script>
</body>
</html>
