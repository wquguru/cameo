name: Submit a character / 投稿角色
description: Add your character to the Cameo gallery. 把你的角色加入 Cameo 角色库。
title: "[Character] "
labels: [character]
body:
  - type: markdown
    attributes:
      value: |
        Need a video? See [Make a character](https://github.com/wquguru/cameo#make-a-character).
        还没有视频？看 [制作角色](https://github.com/wquguru/cameo/blob/main/README.zh-CN.md#制作角色)。
  - type: input
    id: name
    attributes:
      label: Character name / 角色名
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Credit as / 署名
      description: Your X handle (e.g. @you) or a name. 你的 X 账号（如 @you）或名字。
    validations:
      required: true
  - type: textarea
    id: video
    attributes:
      label: Video / 视频
      description: Drag your .mov here (HEVC with Alpha or ProRes 4444, a few seconds, loops cleanly, under 10 MB). 把 .mov 拖到这里（HEVC with Alpha 或 ProRes 4444，几秒、可无缝循环、小于 10 MB）。
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights / 权利
      options:
        - label: I made this character (drawn, filmed or AI-generated by me) and it uses no one else's IP. 角色由我本人制作（手绘、拍摄或 AI 生成），不含他人 IP。
          required: true
        - label: I agree to publish it under CC BY 4.0. 我同意以 CC BY 4.0 发布。
          required: true
