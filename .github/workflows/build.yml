name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cameo
          path: |
            build/Cameo-*.dmg
            build/Cameo-*.zip
            build/checksums.txt
